name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly dependency drift check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Tests with coverage gate
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: End-to-end smoke
        working-directory: backend
        run: python ../scripts/smoke.py

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit[toml] pip-audit

      - name: Static analysis (bandit)
        working-directory: backend
        run: bandit -c pyproject.toml -r app

      - name: Dependency vulnerabilities (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt --strict

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t edid:ci .

      - name: Verify the container runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id edid:ci -u)
          test "$uid" != "0" || { echo "container runs as root"; exit 1; }

      - name: Filesystem and image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: edid:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Publish scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
